<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Very Important Question ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;

            font-family:
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #ff8fa3, transparent 35%),
                radial-gradient(circle at bottom right, #7b2cff, transparent 35%),
                linear-gradient(135deg, #ff4b6e, #8b1e3f);

            position: relative;
        }

        /* =========================
           FLOATING HEARTS
        ========================= */

        .hearts {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            bottom: -50px;

            font-size: 25px;

            animation:
                floatUp linear infinite;

            opacity: 0.75;
        }

        .heart:nth-child(1) {
            left: 5%;
            animation-duration: 8s;
            animation-delay: 0s;
        }

        .heart:nth-child(2) {
            left: 15%;
            animation-duration: 10s;
            animation-delay: 2s;
        }

        .heart:nth-child(3) {
            left: 30%;
            animation-duration: 7s;
            animation-delay: 1s;
        }

        .heart:nth-child(4) {
            left: 45%;
            animation-duration: 11s;
            animation-delay: 3s;
        }

        .heart:nth-child(5) {
            left: 60%;
            animation-duration: 8s;
            animation-delay: 1s;
        }

        .heart:nth-child(6) {
            left: 75%;
            animation-duration: 10s;
            animation-delay: 4s;
        }

        .heart:nth-child(7) {
            left: 90%;
            animation-duration: 7s;
            animation-delay: 2s;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: 0.8;
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }

        /* =========================
           MAIN CARD
        ========================= */

        .container {
            width: min(92%, 520px);

            padding: 45px 35px;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 30px;

            text-align: center;

            position: relative;
            z-index: 5;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.25),
                0 0 40px rgba(255, 255, 255, 0.2);

            animation: cardEnter 1s ease forwards;

            backdrop-filter: blur(10px);
        }

        @keyframes cardEnter {
            0% {
                opacity: 0;
                transform:
                    translateY(50px)
                    scale(0.8);
            }

            100% {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        /* =========================
           SPIDER-MAN BADGE
        ========================= */

        .spiderman {
            display: inline-block;

            background:
                linear-gradient(
                    135deg,
                    #e5092f,
                    #b00020
                );

            color: white;

            padding: 8px 18px;

            border-radius: 30px;

            font-size: 0.85rem;
            font-weight: bold;

            margin-bottom: 15px;

            box-shadow:
                0 5px 15px rgba(229, 9, 47, 0.3);

            animation: pulseBadge 2s infinite;
        }

        @keyframes pulseBadge {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        /* =========================
           HEART ICON
        ========================= */

        .main-heart {
            font-size: 65px;

            animation:
                heartbeat 1.4s infinite;

            margin-bottom: 5px;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            14% {
                transform: scale(1.15);
            }

            28% {
                transform: scale(1);
            }

            42% {
                transform: scale(1.15);
            }

            70% {
                transform: scale(1);
            }
        }

        /* =========================
           TEXT
        ========================= */

        h1 {
            margin: 10px 0;

            font-size: clamp(1.8rem, 6vw, 2.5rem);

            background:
                linear-gradient(
                    135deg,
                    #e5092f,
                    #7b2cff
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            font-weight: 800;
        }

        p {
            color: #666;

            font-size: 1.1rem;

            line-height: 1.6;

            margin:
                0 auto 25px;

            max-width: 430px;
        }

        .boyfriend {
            color: #e5092f;
            font-weight: bold;
        }

        /* =========================
           BUTTON AREA
        ========================= */

        .buttons {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 20px;

            min-height: 100px;

            position: relative;
        }

        button {
            border: none;

            border-radius: 50px;

            padding: 14px 28px;

            font-size: 1.05rem;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.35s ease,
                width 0.35s ease,
                height 0.35s ease,
                opacity 0.35s ease,
                box-shadow 0.35s ease;

            user-select: none;
        }

        /* =========================
           YES BUTTON
        ========================= */

        #yesBtn {
            background:
                linear-gradient(
                    135deg,
                    #ff1744,
                    #e5092f
                );

            color: white;

            box-shadow:
                0 8px 25px rgba(229, 9, 47, 0.4);

            position: relative;

            z-index: 10;
        }

        #yesBtn:hover {
            transform: scale(1.08);

            box-shadow:
                0 12px 35px rgba(229, 9, 47, 0.55);
        }

        /* =========================
           NO BUTTON
        ========================= */

        #noBtn {
            background: #777;

            color: white;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.2);

            position: relative;

            z-index: 20;
        }

        #noBtn:hover {
            background: #666;
        }

        /* =========================
           MESSAGE
        ========================= */

        #reaction {
            min-height: 25px;

            margin-top: 15px;

            font-size: 0.95rem;

            color: #e5092f;

            font-weight: 600;

            transition:
                opacity 0.3s ease;
        }

        /* =========================
           SUCCESS SCREEN
        ========================= */

        .success {
            animation:
                successPop 0.8s ease forwards;
        }

        @keyframes successPop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            70% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success h1 {
            font-size: 3rem;
        }

        .success-text {
            font-size: 1.2rem;
        }

        /* =========================
           CONFETTI
        ========================= */

        .confetti {
            position: fixed;

            width: 10px;
            height: 10px;

            top: -20px;

            z-index: 100;

            animation:
                confettiFall 3s linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }

            100% {
                transform:
                    translateY(110vh)
                    rotate(720deg);

                opacity: 0;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .container {
                padding: 35px 22px;
            }

            .main-heart {
                font-size: 55px;
            }

            p {
                font-size: 1rem;
            }

            button {
                padding: 12px 22px;
                font-size: 0.95rem;
            }

            .buttons {
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- Floating background hearts -->
    <div class="hearts">
        <div class="heart">❤️</div>
        <div class="heart">💕</div>
        <div class="heart">💗</div>
        <div class="heart">❤️</div>
        <div class="heart">💖</div>
        <div class="heart">💕</div>
        <div class="heart">❤️</div>
    </div>


    <!-- Main card -->
    <div class="container" id="card">

        <div class="spiderman">
            🕷️ SPIDER-MAN DATE PROPOSAL 🕷️
        </div>

        <div class="main-heart">
            ❤️
        </div>

        <h1 id="questionText">
            Hey Beautiful... 🥰
        </h1>

        <p id="subText">
            Do you wanna go watch
            <strong>Spider-Man</strong>
            next Saturday,
            with your
            <span class="boyfriend">
                most handsome boyfriend?
            </span>
            ❤️
        </p>


        <div class="buttons" id="btnContainer">

            <button
                id="yesBtn"
                onclick="selectYes()">
                YES! 🥰❤️
            </button>

            <button
                id="noBtn"
                onclick="handleNo()">
                No 😢
            </button>

        </div>

        <div id="reaction"></div>

    </div>


    <script>

        const yesBtn =
            document.getElementById("yesBtn");

        const noBtn =
            document.getElementById("noBtn");

        const questionText =
            document.getElementById("questionText");

        const subText =
            document.getElementById("subText");

        const reaction =
            document.getElementById("reaction");

        const btnContainer =
            document.getElementById("btnContainer");

        const card =
            document.getElementById("card");


        let noClicks = 0;

        let yesScale = 1;

        let noScale = 1;


        /*
        Messages that appear
        when she presses No
        */

        const messages = [

            "Are you sure? 🥺",

            "Wait... think about it 😭",

            "But I'm your handsome boyfriend 🥹",

            "You're really going to do this to me? 💔",

            "Spider-Man would be disappointed... 🕷️",

            "Okay... but the YES button looks pretty good 👀",

            "I think you accidentally pressed No 😌",

            "Surely you don't want to hurt your handsome boyfriend? 🥺",

            "The YES button is getting bigger... just saying 👀",

            "Okay this is getting embarrassing for you 😂",

            "JUST SAY YES ALREADY 😭❤️"

        ];


        function handleNo() {

            noClicks++;

            /*
            Make YES bigger
            */

            yesScale += 0.15;

            yesBtn.style.transform =
                `scale(${yesScale})`;


            /*
            Make NO smaller
            */

            noScale -= 0.08;

            if (noScale < 0.35) {
                noScale = 0.35;
            }

            noBtn.style.transform =
                `scale(${noScale})`;


            /*
            Change message
            */

            const messageIndex =
                Math.min(
                    noClicks - 1,
                    messages.length - 1
                );

            reaction.innerText =
                messages[messageIndex];


            /*
            Make the NO button
            move around
            */

            moveNoButton();


            /*
            If they've clicked No
            many times, make YES
            extra tempting
            */

            if (noClicks >= 6) {

                yesBtn.innerText =
                    "YES!!! 🥰❤️";

            }

            if (noClicks >= 9) {

                yesBtn.innerText =
                    "YES ❤️ DO IT";

            }

            /*
            Shake the card slightly
            */

            card.animate(
                [
                    {
                        transform:
                            "translateX(-4px)"
                    },

                    {
                        transform:
                            "translateX(4px)"
                    },

                    {
                        transform:
                            "translateX(-4px)"
                    },

                    {
                        transform:
                            "translateX(0)"
                    }
                ],
                {
                    duration: 300
                }
            );
        }


        function moveNoButton() {

            /*
            Once the button gets small,
            let it escape anywhere on screen.
            */

            const padding = 20;

            const buttonWidth =
                noBtn.offsetWidth;

            const buttonHeight =
                noBtn.offsetHeight;


            const maxX =
                window.innerWidth -
                buttonWidth -
                padding;

            const maxY =
                window.innerHeight -
                buttonHeight -
                padding;


            const randomX =
                Math.max(
                    padding,
                    Math.random() * maxX
                );

            const randomY =
                Math.max(
                    padding,
                    Math.random() * maxY
                );


            noBtn.style.position = "fixed";

            noBtn.style.left =
                randomX + "px";

            noBtn.style.top =
                randomY + "px";
        }


        /*
        YES BUTTON
        */

        function selectYes() {

            /*
            Change the main text
            */

            questionText.innerText =
                "YAYYYYY!!! 🥰❤️";


            subText.innerHTML =
                `
                I KNEW you'd say yes! 😌❤️
                <br><br>
                Spider-Man + popcorn + you + me.
                <br>
                Sounds like the perfect Saturday to me. 🕷️🍿
                <br><br>
                <strong>
                    Date officially accepted! ❤️
                </strong>
                `;


            /*
            Hide buttons
            */

            btnContainer.style.display =
                "none";

            reaction.style.display =
                "none";


            /*
            Change heart
            */

            document.querySelector(
                ".main-heart"
            ).innerText = "💖";


            /*
            Success animation
            */

            card.classList.add("success");


            /*
            Create celebration
            */

            createConfetti();

            createHeartExplosion();

        }


        /*
        CONFETTI
        */

        function createConfetti() {

            const symbols = [
                "❤️",
                "💕",
                "💖",
                "✨",
                "🎉",
                "🕷️",
                "🍿"
            ];


            for (let i = 0; i < 70; i++) {

                const piece =
                    document.createElement("div");

                piece.classList.add(
                    "confetti"
                );

                piece.innerText =
                    symbols[
                        Math.floor(
                            Math.random() *
                            symbols.length
                        )
                    ];


                piece.style.left =
                    Math.random() * 100 + "vw";


                piece.style.fontSize =
                    (Math.random() * 15 + 10)
                    + "px";


                piece.style.animationDuration =
                    (Math.random() * 2 + 2)
                    + "s";


                piece.style.animationDelay =
                    (Math.random() * 0.8)
                    + "s";


                document.body.appendChild(piece);


                setTimeout(() => {

                    piece.remove();

                }, 4000);
            }
        }


        /*
        HEART EXPLOSION
        */

        function createHeartExplosion() {

            const hearts = [
                "❤️",
                "💕",
                "💗",
                "💖",
                "💘"
            ];


            for (let i = 0; i < 25; i++) {

                const heart =
                    document.createElement("div");

                heart.innerText =
                    hearts[
                        Math.floor(
                            Math.random() *
                            hearts.length
                        )
                    ];


                heart.style.position =
                    "fixed";


                heart.style.left =
                    "50%";


                heart.style.top =
                    "50%";


                heart.style.fontSize =
                    "25px";


                heart.style.zIndex =
                    "200";


                document.body.appendChild(
                    heart
                );


                const angle =
                    Math.random() *
                    Math.PI *
                    2;


                const distance =
                    Math.random() * 300 + 100;


                const x =
                    Math.cos(angle) *
                    distance;


                const y =
                    Math.sin(angle) *
                    distance;


                heart.animate(
                    [
                        {
                            transform:
                                "translate(-50%, -50%) scale(0)",
                            opacity: 1
                        },

                        {
                            transform:
                                `translate(
                                    calc(-50% + ${x}px),
                                    calc(-50% + ${y}px)
                                )
                                scale(1.5)`,

                            opacity: 0
                        }
                    ],
                    {
                        duration:
                            1500 +
                            Math.random() * 1000,

                        easing:
                            "cubic-bezier(.17,.67,.35,1)"
                    }
                );


                setTimeout(() => {

                    heart.remove();

                }, 3000);
            }
        }

    </script>

</body>
</html>
